add_magnet:
  name: Add magnet
  description: Submit a magnet link to qBittorrent for download and automatic organization.
  fields:
    magnet:
      name: Magnet link
      description: The magnet URI to submit.
      required: true
      example: "magnet:?xt=urn:btih:..."
      selector:
        text: {}
    category:
      name: Category
      description: >-
        Series name used internally for classification, dedup scoping, and
        destination-path construction. Leave blank for movies. Never sent to
        qBittorrent itself — it has no bearing on file placement.
      required: false
      selector:
        text: {}
    rename_name:
      name: Rename target
      description: Cleaned title used to rename the downloaded file and/or folder.
      required: false
      selector:
        text: {}
    token_type:
      name: Token type
      description: Release classification — one of "se", "s", "season", "complete", "year", or blank.
      required: false
      selector:
        text: {}
    season:
      name: Season
      description: Normalized season code (e.g. "S03"), when applicable.
      required: false
      selector:
        text: {}

flush_orphaned:
  name: Flush orphaned queue entries
  description: >-
    Remove any torrents from the pending rename queue that no longer exist
    in qBittorrent (e.g. deleted directly from the qBittorrent WebUI).

run_cleanup:
  name: Run temp folder cleanup
  description: >-
    Sweep the configured temp folder for orphaned leftovers and remove them.
    This is the only way the cleanup runs — there is no automatic schedule.
    Logs a summary of what it found and did.
